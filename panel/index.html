<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b4fe8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B4FE8'/%3E%3Cstop offset='1' stop-color='%238B7FF0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>WP AIssistant — Pannello</title>
    <script>
      // Paint the right theme before the first frame. The module bundle is deferred, so
      // resolving the theme only in React would flash a white page at anyone using dark mode.
      // Deliberately duplicates the small resolution rule in src/theme.js — the alternative is
      // the flash, and both sides are covered by theme.test.js.
      (function () {
        try {
          var stored = localStorage.getItem("wpai_panel_theme");
          var pref = ["light", "dark", "auto"].indexOf(stored) >= 0 ? stored : "auto";
          var dark = pref === "dark" || (pref === "auto"
            && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme-preference", pref);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
