# Production stack using Cloudflare Workers AI. Unlike docker-compose.prod.yml this stack
# does not run Ollama and uses bge-m3 embeddings (1024 dimensions).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/andreaem-it/wp-aissistant-backend:latest}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@db:5432/rag
      REDIS_URL: redis://redis:6379/0
      CHAT_MODEL: ${CHAT_MODEL:-cloudflare/@cf/meta/llama-3.1-8b-instruct-fp8}
      EMBED_MODEL: ${EMBED_MODEL:-cloudflare/@cf/baai/bge-m3}
      EMBED_DIM: "1024"
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:?set CLOUDFLARE_API_KEY}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      CORS_ALLOW_ALL: "false"
      STRICT_PRODUCTION_CONFIG: "true"
      PANEL_ORIGINS: ${PANEL_ORIGINS:-}
      FORWARDED_ALLOW_IPS: "*"
      APP_VERSION: ${APP_VERSION:-production}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
      OPERATOR_SESSION_TTL_HOURS: ${OPERATOR_SESSION_TTL_HOURS:-720}
      INGEST_LEASE_SECONDS: ${INGEST_LEASE_SECONDS:-1800}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      OPERATOR_WEBHOOK_URL: ${OPERATOR_WEBHOOK_URL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
  caddyconfig:
