name: Publish widget (Cloudflare R2)

# Pubblica il bundle del widget su R2 con percorsi **versionati e immutabili**.
#
# Perché R2 e non Pages, che pure usiamo già per sito e pannello: `pages deploy` pubblica *il
# sito corrente* e sostituisce la produzione, mentre qui servono versioni che restano vive per
# anni — il plugin pinna una versione con SRI e i siti dei clienti non aggiornano da soli. Su R2
# un `put` aggiunge senza togliere, che è la semantica di un artefatto immutabile.
#
# Si attiva su tag `widget-v*`, non a ogni push: pubblicare una versione è una decisione.
#
# Segreti richiesti:
#   CLOUDFLARE_ACCOUNT_ID  — già presente (lo usano sito e pannello)
#   CLOUDFLARE_R2_TOKEN    — token dedicato, permesso «Workers R2 Storage: Edit».
#                            Deliberatamente **non** quello di Pages: il permesso di scrittura
#                            sul CDN non deve viaggiare nello stesso token che pubblica il sito.

on:
  push:
    tags:
      - "widget-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Costruisci e mostra cosa verrebbe pubblicato, senza caricare"
        type: boolean
        default: true

env:
  BUCKET: wp-aissistant-cdn

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/widget/package-lock.json

      - name: Install
        working-directory: sdk/widget
        run: npm ci

      # Si pubblica solo ciò che passa: un bundle rotto messo su un percorso immutabile ci resta.
      - name: Test
        working-directory: sdk/widget
        run: npm test

      - name: Build
        working-directory: sdk/widget
        run: npm run build

      - name: Read version
        id: meta
        working-directory: sdk/widget
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::widget $version"
          cat dist/integrity.json

      # Il tag deve dire la stessa versione del pacchetto. Senza questo controllo si pubblica
      # `widget-v1.2.0` con dentro l'artefatto 1.1.0, e da quel momento la versione immutabile
      # mente — che è il modo peggiore di sbagliare, perché l'SRI continua a tornare.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/widget-v')
        run: |
          tag="${GITHUB_REF_NAME#widget-v}"
          if [ "$tag" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::il tag dice $tag, il pacchetto ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      - name: Check the credentials are configured
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_R2_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_R2_TOKEN / CLOUDFLARE_ACCOUNT_ID non configurati: niente è stato pubblicato."
          fi

      # Fallisce se i segreti mancano, invece di riportare un successo che non c'è stato: un
      # workflow verde che non ha pubblicato niente è peggio di uno rosso.
      - name: Stop when not configured
        if: steps.creds.outputs.ready != 'true' && github.event_name == 'push'
        run: exit 1

      # Il token esiste: ma è quello giusto? Un token creato con i permessi di Pages supera ogni
      # controllo di configurazione — il segreto c'è, il workflow parte — e fallisce solo al
      # `put`, cioè mentre si sta già pubblicando una versione. Una lettura del bucket lo dice
      # prima, e non scrive niente.
      - name: The token can actually reach the bucket
        if: steps.creds.outputs.ready == 'true'
        working-directory: sdk/widget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler r2 bucket list > /tmp/buckets.txt 2>&1; then
            echo "::error::il token non riesce a leggere R2. Serve il permesso «Workers R2 Storage: Edit»; quello di Pages non basta."
            sed -n '1,20p' /tmp/buckets.txt
            exit 1
          fi
          if ! grep -q "${{ env.BUCKET }}" /tmp/buckets.txt; then
            echo "::error::il bucket ${{ env.BUCKET }} non è visibile con questo token."
            sed -n '1,20p' /tmp/buckets.txt
            exit 1
          fi
          echo "::notice::token valido, bucket ${{ env.BUCKET }} raggiungibile"

      # La regola CORS del bucket va verificata **prima** di pubblicare, non dopo.
      #
      # Con `Cache-Control: immutable, max-age=31536000` una risposta salvata al bordo senza
      # `Access-Control-Allow-Origin` ci resta un anno: aggiungere la regola dopo non la corregge,
      # perché la cache è per origine (`Vary: Origin`) e chi aveva già chiesto il file continua a
      # ricevere quella vecchia. Ci è successo sul nostro sito, che è stato anche il primo a
      # caricarlo — e l'unico rimedio è stato svuotare la cache a mano.
      - name: The bucket allows cross-origin reads
        if: steps.creds.outputs.ready == 'true' && !inputs.dry_run
        working-directory: sdk/widget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler r2 bucket cors list "${{ env.BUCKET }}" > /tmp/cors.txt 2>&1; then
            echo "::error::impossibile leggere le regole CORS del bucket."
            sed -n '1,20p' /tmp/cors.txt
            exit 1
          fi
          if ! grep -qi "get" /tmp/cors.txt; then
            echo "::error::il bucket non ha una regola CORS che ammetta GET: un browser scarterebbe lo script (integrity + crossorigin). Applica cloudflare/cdn/cors.json prima di pubblicare."
            sed -n '1,20p' /tmp/cors.txt
            exit 1
          fi
          echo "::notice::regola CORS presente"

      - name: Publish the immutable version
        if: steps.creds.outputs.ready == 'true' && !inputs.dry_run
        working-directory: sdk/widget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Un anno di cache e `immutable`: il browser non ricontrolla mai. È sicuro solo perché
          # il percorso contiene la versione — questo file, a questo indirizzo, non cambierà.
          immutable="public, max-age=31536000, immutable"
          for file in wpai-widget.js wpai-widget.css; do
            type="application/javascript"
            [ "${file##*.}" = "css" ] && type="text/css"
            npx wrangler r2 object put "${{ env.BUCKET }}/widget/$VERSION/$file" \
              --file "dist/$file" --content-type "$type" --cache-control "$immutable" --remote
          done
          npx wrangler r2 object put "${{ env.BUCKET }}/widget/$VERSION/integrity.json" \
            --file dist/integrity.json --content-type "application/json" \
            --cache-control "$immutable" --remote

      # L'alias mobile è una comodità, non il default: chi lo usa rinuncia all'SRI e non decide
      # quando il codice cambia. Cache breve, così una correzione arriva in fretta senza che un
      # errore resti inchiodato per un anno.
      - name: Move the v1 alias
        if: steps.creds.outputs.ready == 'true' && !inputs.dry_run && startsWith(github.ref, 'refs/tags/widget-v')
        working-directory: sdk/widget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mutable="public, max-age=300, stale-while-revalidate=86400"
          for file in wpai-widget.js wpai-widget.css; do
            type="application/javascript"
            [ "${file##*.}" = "css" ] && type="text/css"
            npx wrangler r2 object put "${{ env.BUCKET }}/widget/v1/$file" \
              --file "dist/$file" --content-type "$type" --cache-control "$mutable" --remote
          done

      - name: What was published
        if: steps.creds.outputs.ready == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "::notice::https://cdn.wpaissistant.it/widget/$VERSION/wpai-widget.js"
          echo "::notice::alias mobile: https://cdn.wpaissistant.it/widget/v1/wpai-widget.js"

      # Prova che il file è davvero servibile da un browser. È il controllo che distingue "il
      # `put` non ha dato errore" da "il widget si carica": il dominio personalizzato del bucket
      # è un pezzo di configurazione a parte, e senza di esso gli oggetti esistono ma non sono
      # raggiungibili se non con richieste firmate.
      - name: Verify it is publicly reachable
        if: steps.creds.outputs.ready == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          url="https://cdn.wpaissistant.it/widget/$VERSION/wpai-widget.js"
          code="$(curl -s -o /tmp/published.js -w '%{http_code}' --max-time 30 "$url")"
          if [ "$code" != "200" ]; then
            echo "::error::$url risponde $code — il dominio personalizzato non è collegato al bucket"
            exit 1
          fi
          local_sri="$(node -p "require('./sdk/widget/dist/integrity.json').files['wpai-widget.js']")"
          remote_sri="sha384-$(openssl dgst -sha384 -binary /tmp/published.js | openssl base64 -A)"
          if [ "$local_sri" != "$remote_sri" ]; then
            echo "::error::il file pubblicato non corrisponde all'SRI calcolata"
            exit 1
          fi
          # Un browser che carica uno script con `integrity` deve aggiungere
          # `crossorigin="anonymous"`, e quel fetch è in modalità CORS: senza
          # `Access-Control-Allow-Origin` sulla risposta il browser **scarta il file che ha
          # appena scaricato**, e il widget non compare. Nulla fallisce lato server — il put è
          # andato, l'URL risponde 200, l'impronta coincide — quindi senza questo controllo il
          # workflow direbbe che è tutto a posto. `curl` non fa CORS: bisogna chiederlo.
          acao="$(curl -s -I --max-time 30 -H "Origin: https://www.wpaissistant.it" "$url" \
            | grep -i '^access-control-allow-origin' || true)"
          if [ -z "$acao" ]; then
            echo "::error::$url non manda Access-Control-Allow-Origin: un browser scarterebbe lo script (integrity + crossorigin). Configura le regole CORS del bucket R2."
            exit 1
          fi
          echo "::notice::pubblicato e verificato (CORS incluso): $url"
