name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.lock
      - name: Run pytest (unit + integration)
        working-directory: backend
        run: pytest -q

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.lock
      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Downgrade to base (verify reversibility)
        working-directory: backend
        run: alembic downgrade base

  panel-build:
    name: Panel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Install dependencies
        working-directory: panel
        run: npm ci
      - name: Lint
        working-directory: panel
        run: npm run lint
      - name: Unit tests
        working-directory: panel
        run: npm test
      - name: Build
        working-directory: panel
        run: npm run build

  whatsapp-worker:
    name: WhatsApp Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/whatsapp-adapter/package-lock.json
      - name: Install dependencies
        working-directory: cloudflare/whatsapp-adapter
        run: npm ci
      - name: Unit tests
        working-directory: cloudflare/whatsapp-adapter
        run: npm test
      - name: Build Worker
        working-directory: cloudflare/whatsapp-adapter
        run: npx wrangler deploy --dry-run

  meta-messaging-worker:
    name: Messenger/Instagram Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/meta-messaging-adapter/package-lock.json
      - name: Install dependencies
        working-directory: cloudflare/meta-messaging-adapter
        run: npm ci
      - name: Unit tests
        working-directory: cloudflare/meta-messaging-adapter
        run: npm test
      - name: Build Worker
        working-directory: cloudflare/meta-messaging-adapter
        run: npx wrangler deploy --dry-run

  email-worker:
    name: Email router Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/email-router/package-lock.json
      - name: Install dependencies
        working-directory: cloudflare/email-router
        run: npm ci
      - name: Unit tests
        working-directory: cloudflare/email-router
        run: npm test
      - name: Build Worker
        working-directory: cloudflare/email-router
        run: npx wrangler deploy --dry-run

  attachment-worker:
    name: Private attachment Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/attachment-storage/package-lock.json
      - name: Install dependencies
        working-directory: cloudflare/attachment-storage
        run: npm ci
      - name: Unit tests
        working-directory: cloudflare/attachment-storage
        run: npm test
      - name: Build Worker
        working-directory: cloudflare/attachment-storage
        run: npx wrangler deploy --dry-run

  crm-worker:
    name: CRM adapter Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/crm-adapter/package-lock.json
      - name: Install dependencies
        working-directory: cloudflare/crm-adapter
        run: npm ci
      - name: Unit tests
        working-directory: cloudflare/crm-adapter
        run: npm test
      - name: Build Worker
        working-directory: cloudflare/crm-adapter
        run: npx wrangler deploy --dry-run

  browser-sdk:
    name: Headless browser SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        working-directory: sdk/browser
        run: npm test
      - name: Type declarations
        working-directory: sdk/browser
        run: npm run types
      - name: Package contents
        working-directory: sdk/browser
        run: npm pack --dry-run

  docker-build:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t wp-aissistant-backend backend

  plugin-build:
    name: WP plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none
      - name: Install plugin quality tools
        working-directory: wp-plugin
        run: composer install --no-interaction --prefer-dist
      - name: WordPress security standards
        working-directory: wp-plugin
        run: composer lint
      - name: Lint PHP
        run: php -l wp-plugin/wp-aissistant/wp-aissistant.php
      - name: Check plugin JavaScript syntax
        run: |
          node --check wp-plugin/wp-aissistant/assets/wp-host.js
          node --check wp-plugin/wp-aissistant/assets/admin-sync.js
          node --check wp-plugin/wp-aissistant/assets/admin-settings.js
      # Il widget vive in sdk/widget e non è più codice del plugin: qui si installa, si verifica
      # e si costruisce, perché è build.sh a copiarne l'artefatto dentro il pacchetto.
      - name: Widget package
        working-directory: sdk/widget
        run: |
          npm ci
          npm test
      - name: Build zip
        working-directory: wp-plugin
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-aissistant-plugin
          path: wp-plugin/dist/*.zip

  compose-validate:
    name: Validate prod compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          ADMIN_API_KEY=dummy docker compose -f docker-compose.prod.yml config -q
          POSTGRES_PASSWORD=dummy ADMIN_API_KEY=dummy CLOUDFLARE_API_KEY=dummy \
            CLOUDFLARE_ACCOUNT_ID=dummy docker compose -f docker-compose.prod-cloud.yml config -q

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python lock
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Audit panel dependencies
        working-directory: panel
        run: npm audit --omit=dev --audit-level=high
