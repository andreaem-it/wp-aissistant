name: Deploy panel (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".github/workflows/deploy-panel.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and publish panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install and build
        working-directory: panel
        run: |
          npm ci
          npm run build

      # A deploy workflow that silently skips the deploy is worse than no workflow: it reports
      # green while the panel stays stale, and nobody looks at a green check. Fail instead.
      - name: Check Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID non configurati: il panel NON è stato pubblicato."
            echo "::error::Impostali in Settings → Secrets and variables → Actions, oppure pubblica a mano con:"
            echo "::error::  cd panel && npm run build && npx wrangler pages deploy dist --project-name=wp-aissistant-panel --branch=main"
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy panel/dist --project-name=wp-aissistant-panel --branch=main
