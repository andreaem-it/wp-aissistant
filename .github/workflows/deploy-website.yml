name: Deploy website (Cloudflare Pages)

# Deploys the static marketing site in website/ to Cloudflare Pages. Requires two repo
# secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Until they're set, the job
# skips cleanly (green) instead of failing.
#
# The silent skip is tolerable *here only*: the wp-aissistant-site Pages project has
# Cloudflare's native Git integration, so it redeploys on push whether or not this job runs.
# The panel has no such integration — there the same skip left it a week stale, which is why
# deploy-panel.yml now fails loudly instead. Do not "align" the two workflows.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          fi

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=wp-aissistant-site --branch=main
